version: '3.8'

services:
  # ==========================================
  # 1. INGESTION SERVICE DATABASE (Port 5432)
  # ==========================================
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: doc-qa-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin12345
      POSTGRES_DB: document_qa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - doc-qa-network

  # ==========================================
  # 2. WORKER SERVICE DATABASE (Port 5433)
  # ==========================================
  worker-postgres:
    image: pgvector/pgvector:pg16
    container_name: doc-qa-worker-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin12345
      POSTGRES_DB: document_worker_db
    ports:
      - "5433:5432"
    volumes:
      - worker_postgres_data:/var/lib/postgresql/data
    networks:
      - doc-qa-network

  # ==========================================
  # 3. KAFKA (KRaft Mode) & UI
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: doc-qa-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # Ye CLUSTER_ID Confluent me KRaft ko initialize karne ke liye zaroori hai
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - doc-qa-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: doc-qa-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - doc-qa-network

  # ==========================================
  # 4. MINIO (Object Storage)
  # ==========================================
  minio:
    image: minio/minio
    container_name: doc-qa-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API Port (For Spring Boot)
      - "9001:9001"   # Web UI Port (For us to view files)
    volumes:
      - minio_data:/data
    networks:
      - doc-qa-network

# ==========================================
# VOLUMES & NETWORKS
# ==========================================
volumes:
  postgres_data:
  worker_postgres_data:
  minio_data:

# Define a shared network so they can talk to each other
networks:
  doc-qa-network:
    driver: bridge

