server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://192.168.1.13:5173"
            allowedMethods: "*"
            allowedHeaders: "*"

      routes:
        - id: ingestion-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/documents/**

        - id: query-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/qa/**


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true