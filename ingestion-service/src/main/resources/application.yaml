server:
  port: 8081

spring:
  application:
    name: ingestion-service

  # Postgresql configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/document_qa
    username: admin
    password: admin12345
    driver-class-name: org.postgresql.Driver

  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Kafka Producer Configuration
  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    topic:
      ingestion: document-ingestion-topic

  # Multipart (File upload) Configuration
  servlet:
    multipart:
      max-file-size: 10MB # Ek baar me 10MB se badi PDF allow nahi karenge
      max-request-size: 10MB



# Custom MinIO Configuration
minio:
  url: http://localhost:9000
  access-key: admin
  secret-key: admin12345
  bucket-name: raw-document



